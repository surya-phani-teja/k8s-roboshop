apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
  # these are replica set labels
  labels:
    project: roboshop
    component: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: roboshop
      component: frontend
      tier: frontend
  # pod definition
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: suryasandy/frontend:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: frontend
        readinessProbe:
          httpGet:
            path: /health
            port: livness-port
          failureThreshold: 1
          periodSeconds: 15
        livnesProbe:
          httpGet:
            path: /health
            port: livness-port
          failureThreshold: 1
          periodSeconds: 15
---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: 
    component: frontned
    tier: frontend
  ports: 
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #contianerport

